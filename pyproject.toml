[project]
name = "grok"
version = "0.1.0"
description = "Grok Dify-parity tools through Ace Data Cloud for ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/GrokComfyUI"
Documentation = "https://github.com/AceDataCloud/GrokComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/GrokComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Grok by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/GrokComfyUI/main/assets/logo-400.png"
